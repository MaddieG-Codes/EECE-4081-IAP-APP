{% extends "base.html" %}
{% block title %}{{ location.name }} · Southern City Explorer{% endblock %}
{% block content %}
<article>
  <h1>{{ location.name }}</h1>
  <p class="meta"><span class="city">{{ location.city }}</span> ·
     <span class="category">{{ location.category }}</span></p>
  <p class="description">{{ location.description }}</p>
  <p class="coords">{{ location.latitude }}, {{ location.longitude }}</p>
  <p><a href="{{ url_for('main.map_view') }}">Back to map</a></p>
</article>
{% endblock %}
